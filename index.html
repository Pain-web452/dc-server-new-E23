<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Automation Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fceef2; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #d63384; font-size: 20px; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 13px; color: #333; display: block; margin-top: 12px; }
        input[type="text"], input[type="password"], input[type="file"], input[type="number"] {
            width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; background: #fafafa;
        }
        .btn-submit {
            background-color: #d63384; color: white; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: bold;
            border-radius: 4px; cursor: pointer; margin-top: 20px; text-transform: uppercase;
        }
        .btn-submit:hover { background-color: #c2185b; }
        .status-box { background: #111; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 12px; margin-top: 20px; min-height: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Messenger Automation</h2>
    
    <form action="/start-task" method="POST" enctype="multipart/form-data">
        <label>Facebook Email/Phone:</label>
        <input type="text" name="fbEmail" placeholder="e.g. 9876543210" required>

        <label>Facebook Password:</label>
        <input type="password" name="fbPassword" placeholder="******" required>

        <label>Target Chat URL:</label>
        <input type="text" name="targetUrl" placeholder="https://facebook.com..." required>

        <label>E2EE 6-Digit PIN (Optional):</label>
        <input type="text" name="e2eePin" placeholder="e.g. 123456">

        <label>Message Prefix (Optional):</label>
        <input type="text" name="messagePrefix" placeholder="e.g. [RAJ]">

        <label>Messages (.txt File):</label>
        <input type="file" name="messageFile" accept=".txt" required>

        <label>Delay (In Seconds):</label>
        <input type="number" name="delaySeconds" value="120" min="5">

        <button type="submit" class="btn-submit">Start Task</button>
    </form>

    <div class="status-box">
        Waiting for task to launch... Connected to Server.
    </div>
</div>

</body>
</html>
