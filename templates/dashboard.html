<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot Panel</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffb3d9, #ff66b2);
            color: #333;
            padding: 15px;
            min-height: 100vh;
        }
        .card {
            background: rgba(255,255,255,0.85);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }
        h1 { text-align: center; color: #fff; font-size: 24px; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); margin: 10px 0; }
        h3 { color: #d63384; margin-top: 0; }
        label { display: block; margin-top: 12px; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
        textarea, input[type="text"], input[type="number"], input[type="file"] {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 2px solid #ffb3d9; background: #fff;
            color: #333; font-size: 14px; box-sizing: border-box;
        }
        textarea:focus, input:focus { outline: none; border-color: #ff3399; }
        button {
            padding: 14px 20px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #ff3399, #ff0066);
            color: white; font-weight: bold; font-size: 15px;
            cursor: pointer; width: 100%; margin-top: 12px;
            box-shadow: 0 4px 15px rgba(255,51,153,0.4);
        }
        button:hover { opacity: 0.9; }
        button.secondary { background: #555; box-shadow: none; }
        button.blue { background: linear-gradient(135deg, #3399ff, #0066ff); }
        button.gray { background: #888; }
        .clear-btn { background: #ffcc00; color: #333; width: auto; padding: 8px 16px; margin: 0; font-size: 13px; }
        .status-badge {
            display: block; text-align: center; padding: 12px;
            border-radius: 10px; font-weight: bold; margin-bottom: 15px;
            font-size: 15px;
        }
        .online { background: #00c853; color: white; }
        .offline { background: #ff3366; color: white; }
        .logs {
            background: #1a1a1a; color: #00ff88; padding: 15px;
            border-radius: 10px; font-family: 'Courier New', monospace;
            font-size: 12px; max-height: 280px; overflow-y: auto;
            white-space: pre-wrap; line-height: 1.5;
        }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        .subtitle { text-align: center; color: #fff; font-size: 13px; margin-top: -5px; }
    </style>
</head>
<body>

<h1>⚡ 24/7 Messenger Bot Panel ⚡</h1>
<p class="subtitle">Safe Group Message Sender</p>

<div class="card">
    <div id="statusBar" class="status-badge offline">Status: Stopped</div>
</div>

<div class="card">
    <h3>🔐 Step 1: Upload Cookies</h3>
    <label>Cookies JSON File (cookies.json)</label>
    <input type="file" id="cookieFile" accept=".json">
    <button class="blue" onclick="uploadCookies()">📤 Upload Cookies</button>
</div>

<div class="card">
    <h3>📝 Step 2: Upload Message File</h3>
    <label>Message File (message.txt) — Jo message bhejna hai</label>
    <input type="file" id="messageFile" accept=".txt">
    <button class="blue" onclick="uploadMessage()">📤 Upload Message</button>
    <textarea id="messagePreview" rows="4" placeholder="Message yahan dikhega..." style="margin-top:10px;"></textarea>
</div>

<div class="card">
    <h3>⚙️ Step 3: Bot Configuration</h3>
    <label>Group ID (Jis group mein bhejna hai)</label>
    <input type="text" id="groupId" placeholder="Enter Group ID" />
    
    <label>Interval (Seconds) — Default 3600 (1 hour)</label>
    <input type="number" id="interval" value="3600" min="60" />
    
    <button onclick="startBot()">🚀 Start Bot</button>
    <button class="gray" onclick="stopBot()">🛑 Stop Bot</button>
</div>

<div class="card">
    <div class="row">
        <h3 style="flex:1;">📜 Bot Logs</h3>
        <button class="clear-btn" onclick="clearLogs()">Clear Logs</button>
    </div>
    <div class="logs" id="logBox">Waiting...</div>
</div>

<script>
    async function updateStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            const bar = document.getElementById('statusBar');
            if (data.status === 'Running') {
                bar.className = 'status-badge online';
                bar.innerText = 'Status: Online ✅';
            } else {
                bar.className = 'status-badge offline';
                bar.innerText = 'Status: ' + data.status;
            }
            
            const logBox = document.getElementById('logBox');
            logBox.innerText = data.logs.join('\n') || 'No logs yet...';
            logBox.scrollTop = logBox.scrollHeight;
        } catch(e) {}
    }

    async function uploadCookies() {
        const file = document.getElementById('cookieFile').files[0];
        if (!file) { alert('Cookies file select karein'); return; }
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/api/upload_cookies', { method: 'POST', body: fd });
        const data = await res.json();
        alert(JSON.stringify(data));
    }

    async function uploadMessage() {
        const file = document.getElementById('messageFile').files[0];
        if (!file) { alert('Message file select karein'); return; }
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/api/upload_message', { method: 'POST', body: fd });
        const data = await res.json();
        alert(JSON.stringify(data));
        
        const text = await file.text();
        document.getElementById('messagePreview').value = text;
    }

    async function startBot() {
        const groupId = document.getElementById('groupId').value.trim();
        const interval = document.getElementById('interval').value;
        if (!groupId) { alert('Group ID daalein'); return; }
        
        const res = await fetch('/api/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ group_id: groupId, interval: interval })
        });
        const data = await res.json();
        alert(JSON.stringify(data));
        updateStatus();
    }

    async function stopBot() {
        await fetch('/api/stop', { method: 'POST' });
        updateStatus();
    }

    async function clearLogs() {
        await fetch('/api/clear_logs', { method: 'POST' });
        updateStatus();
    }

    setInterval(updateStatus, 3000);
    updateStatus();
</script>

</body>
</html>
