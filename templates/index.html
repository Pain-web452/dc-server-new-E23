<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Cookie Automation Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f5; padding: 10px; margin: 0; }
        .container { max-width: 420px; background: white; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #e91e63; }
        h2 { color: #d81b60; margin: 0 0 5px 0; font-size: 20px; text-align: center; }
        .alert { background-color: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; font-weight: bold; text-align: center;}
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #444; }
        textarea, input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; background: #fff9fb; }
        button { width: 100%; padding: 12px; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #e91e63; }
        .monitor-box { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #eee; border-radius: 8px; display: none; }
        .console { background: #111; color: #39ff14; font-family: monospace; padding: 12px; height: 160px; overflow-y: auto; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Messenger Cookie Automation Bot</h2>
    <p style="text-align:center; font-size:11px; margin-top:0; color:#666;">COOKIES INBOX FLOW (PYTHON RENDER)</p>
    
    <div class="alert">[✓] Bot Status: Live & Ready</div>

    <form id="botForm">
        <div class="form-group">
            <label>यहाँ अपनी Facebook Cookies पेस्ट करें (एक लाइन में एक)</label>
            <textarea id="cookies" rows="4" placeholder="c_user=xxxx; xs=xxxx;..."></textarea>
        </div>

        <div class="form-group">
            <label>Target ID / Convo ID (IB Thread ID)</label>
            <input type="text" id="targetId" placeholder="उदा. t_id.10000xxxxxxxx">
        </div>

        <div class="form-group">
            <label>Hater Name (Optional)</label>
            <input type="text" id="haterName" placeholder="उदा. Brand">
        </div>

        <div class="form-group">
            <label>मैसेज लिस्ट (हर लाइन में नया मैसेज)</label>
            <textarea id="messages" rows="3" placeholder="मैसेज 1&#10;मैसेज 2"></textarea>
        </div>

        <div class="form-group">
            <label>Delay in seconds</label>
            <input type="number" id="delay" value="10">
        </div>

        <button type="button" class="btn-start" id="startBtn" onclick="startTask()">START TASK</button>
    </form>

    <!-- Task Monitor -->
    <div id="monitorBox" class="monitor-box">
        <p style="margin: 0 0 10px 0;">Status: <span style="color: green; font-weight: bold;">🟢 Running Logs</span></p>
        <button style="width: auto; background: #dc3545; padding: 5px 15px; font-size: 12px; margin-bottom: 10px;" onclick="stopTask()">STOP</button>
        <div class="console" id="logConsole"></div>
    </div>
</div>

<script>
    let logInterval = null;

    async function startTask() {
        const cookies = document.getElementById('cookies').value;
        const target_id = document.getElementById('targetId').value;
        const delay = document.getElementById('delay').value;
        const hater_name = document.getElementById('haterName').value;
        const messages = document.getElementById('messages').value;

        if (!cookies || !target_id || !messages) {
            alert("कृपया सभी फ़ील्ड्स भरें!");
            return;
        }

        document.getElementById('monitorBox').style.display = 'block';
        const consoleLog = document.getElementById('logConsole');
        consoleLog.innerHTML = "[SYSTEM] Render Connecting...<br>";

        try {
            await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cookies, target_id, delay, messages, hater_name })
            });
        } catch (err) {}

        if(logInterval) clearInterval(logInterval);
        logInterval = setInterval(async () => {
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                consoleLog.innerHTML = logs.join('<br>');
                consoleLog.scrollTop = consoleLog.scrollHeight;
            } catch (e) {}
        }, 2000);
    }

    async function stopTask() {
        await fetch('/api/stop', { method: 'POST' });
        if(logInterval) clearInterval(logInterval);
        alert("टास्क रोक दिया गया है!");
    }
</script>
</body>
</html>
