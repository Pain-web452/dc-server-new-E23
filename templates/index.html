<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messenger API Sender</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #fce4ec;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,.12);
        }

        h1 {
            text-align: center;
            color: #d81b60;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
        }

        .group {
            margin-bottom: 16px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 11px;
            outline: none;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #e91e63;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #e91e63;
            color: white;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .console {
            margin-top: 20px;
            background: #1e1e1e;
            color: #00ff00;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .note {
            margin-top: 14px;
            padding: 10px;
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 8px;
            font-size: 11px;
            color: #795548;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Messenger API Sender</h1>

    <div class="subtitle">
        Official API based sender
    </div>

    <div class="group">
        <label>Page Access Token</label>
        <input
            id="pageToken"
            type="password"
            placeholder="Paste Page Access Token"
            autocomplete="off"
        >
    </div>

    <div class="group">
        <label>Recipient PSID</label>
        <input
            id="recipientPsid"
            type="text"
            placeholder="Recipient PSID"
        >
    </div>

    <div class="group">
        <label>Message</label>
        <textarea
            id="message"
            placeholder="Type your message..."
        ></textarea>
    </div>

    <button id="sendBtn" onclick="sendMessage()">
        Send Message
    </button>

    <div class="console" id="console">
[SYSTEM] Ready.
    </div>

    <div class="note">
        Use a valid Page Access Token and a recipient PSID for a
        recipient who is eligible to receive messages from your Page.
    </div>

</div>

<script>
function log(message) {
    const consoleBox = document.getElementById("console");

    const time = new Date().toLocaleTimeString();

    consoleBox.textContent +=
        `\n[${time}] ${message}`;

    consoleBox.scrollTop = consoleBox.scrollHeight;
}


async function sendMessage() {

    const button = document.getElementById("sendBtn");

    const pageAccessToken =
        document.getElementById("pageToken").value.trim();

    const recipientPsid =
        document.getElementById("recipientPsid").value.trim();

    const message =
        document.getElementById("message").value.trim();


    if (!pageAccessToken) {
        log("[ERROR] Page Access Token missing.");
        return;
    }

    if (!recipientPsid) {
        log("[ERROR] Recipient PSID missing.");
        return;
    }

    if (!message) {
        log("[ERROR] Message is empty.");
        return;
    }


    button.disabled = true;
    log("[SYSTEM] Sending request to server...");


    try {

        const response = await fetch(
            "/api/send-message",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    pageAccessToken: pageAccessToken,
                    recipientPsid: recipientPsid,
                    message: message
                })
            }
        );


        const data = await response.json();


        if (data.status === "success") {

            log("[SUCCESS] " + data.message);

            if (data.result) {
                log(
                    "[API] " +
                    JSON.stringify(data.result)
                );
            }

        } else {

            log(
                "[ERROR] " +
                (data.message || "Message failed.")
            );

            if (data.code) {
                log("[META CODE] " + data.code);
            }

            if (data.http_status) {
                log(
                    "[HTTP STATUS] " +
                    data.http_status
                );
            }
        }

    } catch (error) {

        log(
            "[ERROR] Request failed: " +
            error.message
        );

    } finally {

        button.disabled = false;
    }
}
</script>

</body>
</html>
